<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⏳ Tempo juntos • Espaço para você</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0a, #1f0020, #ff4da6);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #ffb6d9;
        }

        .container {
            width: 100%;
            max-width: 820px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 40px 30px;
            box-shadow: 0 0 40px rgba(255, 77, 166, 0.6), 0 0 15px rgba(255, 77, 166, 0.3);
            border: 1px solid rgba(255, 77, 166, 0.3);
            display: flex;
            flex-direction: column;
            gap: 30px;
            transition: all 0.3s ease;
        }

        /* CONTADOR — destaque total */
        .contador-wrapper {
            text-align: center;
            background: rgba(255, 77, 166, 0.08);
            border-radius: 30px;
            padding: 25px 20px;
            border: 2px solid #ff4da6;
            box-shadow: 0 0 25px #ff4da6;
            transition: box-shadow 0.3s;
        }

        .contador-wrapper h2 {
            color: #ffb6d9;
            font-weight: 400;
            letter-spacing: 2px;
            font-size: 1.3rem;
            text-transform: uppercase;
            margin-bottom: 15px;
            text-shadow: 0 0 8px rgba(255, 77, 166, 0.7);
        }

        #contador {
            font-size: 2.4rem;
            font-weight: 800;
            color: #ff8ac8;
            text-shadow: 0 0 12px #ff1493, 0 0 25px #ff4da6;
            line-height: 1.4;
            word-break: break-word;
            padding: 5px 0;
            font-variant-numeric: tabular-nums;
        }

        #contador span {
            display: inline-block;
            transition: transform 0.2s;
        }

        /* ÁREA DE DIGITAÇÃO — espaço limpo, sem texto extra */
        .area-digitar {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 30px;
            padding: 10px;
            border: 2px dashed #ff4da6;
            transition: border 0.2s, box-shadow 0.2s;
        }

        .area-digitar:focus-within {
            border: 2px solid #ff8ac8;
            box-shadow: 0 0 25px #ff4da6;
        }

        .area-digitar textarea {
            width: 100%;
            min-height: 280px;
            background: transparent;
            border: none;
            outline: none;
            resize: vertical;
            color: #ffd9e8;
            font-size: 1.15rem;
            line-height: 1.7;
            padding: 20px 22px;
            font-family: inherit;
            border-radius: 25px;
            letter-spacing: 0.3px;
        }

        .area-digitar textarea::placeholder {
            color: #ff8ac880;
            font-style: italic;
            font-weight: 300;
            opacity: 0.7;
        }

        /* pequeno rodapé decorativo (sem texto, só coração) */
        .rodape {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            color: #ff4da6;
            font-size: 1.2rem;
            opacity: 0.7;
            margin-top: 5px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px 15px;
                border-radius: 30px;
                gap: 20px;
            }

            #contador {
                font-size: 1.7rem;
            }

            .contador-wrapper h2 {
                font-size: 1rem;
            }

            .area-digitar textarea {
                min-height: 220px;
                font-size: 1rem;
                padding: 15px;
            }
        }

        @media (max-width: 380px) {
            #contador {
                font-size: 1.3rem;
            }
            .contador-wrapper h2 {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- TEMPORIZADOR (único texto mantido) -->
        <div class="contador-wrapper">
            <h2>⏳ Estamos juntinhos há</h2>
            <div id="contador">carregando...</div>
        </div>

        <!-- ESPAÇO PARA DIGITAR (sem texto inicial) -->
        <div class="area-digitar">
            <textarea id="meuTexto" placeholder="Digite aqui... (este espaço é seu)" spellcheck="false"></textarea>
        </div>

        <!-- apenas um detalhe visual, sem texto significativo -->
        <div class="rodape">❤️</div>
    </div>

    <script>
        (function() {
            // ===== CONFIGURAÇÃO DO CONTADOR (mesma data original) =====
            const dataInicio = new Date("2026-04-12T00:00:00");

            function atualizarContador() {
                const agora = new Date();
                const diferenca = agora - dataInicio;

                // Se a data ainda não chegou (caso raro), mostra zero
                if (diferenca < 0) {
                    document.getElementById("contador").innerHTML = "0 dias, 0 horas, 0 minutos e 0 segundos";
                    return;
                }

                const dias = Math.floor(diferenca / (1000 * 60 * 60 * 24));
                const horas = Math.floor((diferenca / (1000 * 60 * 60)) % 24);
                const minutos = Math.floor((diferenca / (1000 * 60)) % 60);
                const segundos = Math.floor((diferenca / 1000) % 60);

                // Formatação com dois dígitos para horas, minutos e segundos (opcional, mas fica bonito)
                const horasStr = horas.toString().padStart(2, '0');
                const minutosStr = minutos.toString().padStart(2, '0');
                const segundosStr = segundos.toString().padStart(2, '0');

                document.getElementById("contador").innerHTML = 
                    `${dias} dias, ${horasStr} horas, ${minutosStr} minutos e ${segundosStr} segundos`;
            }

            // Atualiza a cada segundo
            setInterval(atualizarContador, 1000);
            atualizarContador(); // executa imediatamente

            // ===== OPCIONAL: SALVAR O TEXTO DIGITADO NO NAVEGADOR (localStorage) =====
            // Assim, se a pessoa recarregar a página, o texto não se perde.
            const textarea = document.getElementById('meuTexto');

            // Carrega o texto salvo anteriormente, se existir
            const textoSalvo = localStorage.getItem('textoAlice');
            if (textoSalvo) {
                textarea.value = textoSalvo;
            }

            // Salva sempre que o conteúdo mudar
            textarea.addEventListener('input', () => {
                localStorage.setItem('textoAlice', textarea.value);
            });

            // (Opcional: limpar o localStorage quando quiser — só descomente se necessário)
            // localStorage.removeItem('textoAlice');
        })();
    </script>

</body>
</html>
